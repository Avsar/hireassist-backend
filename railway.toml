[build]
builder = "dockerfile"

[deploy]
# No startCommand: the Dockerfile CMD (sh -c "... ${PORT}") handles startup so
# $PORT is expanded by the shell. A startCommand here runs in exec form without
# a shell, passing "$PORT" literally and breaking the bind.
healthcheckPath = "/ping"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
