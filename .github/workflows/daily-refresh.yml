name: Daily job refresh

# Runs the full job pipeline (discover -> scrape -> ATS sync -> stats -> export)
# on GitHub's runners instead of a local laptop, then pushes the fresh bundle to
# the live Railway app. State (companies.db) is carried between runs via the
# Actions cache; the committed data/seed/bundle.json is refreshed weekly as a
# durable fallback for cache eviction and Railway cold starts.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # to commit the weekly bundle snapshot

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: companies.db
          key: jobsdb-${{ github.run_id }}
          restore-keys: |
            jobsdb-

      - name: Record restored state
        id: state
        run: |
          # cache@v4's cache-hit is only true on an exact key match (never, since
          # the key includes run_id), so detect a successful restore by file presence.
          if [ -f companies.db ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap DB from committed bundle (cache miss only)
        if: steps.state.outputs.restored == 'false'
        run: python ci_bootstrap_db.py

      - name: Run daily pipeline
        env:
          DB_PATH: companies.db
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --skip-git: the workflow handles the commit below.
          # --skip-alerts: email digests need SMTP secrets (enable later).
          python daily_intelligence.py --skip-git --skip-alerts

      - name: Decide whether to commit bundle snapshot
        id: snap
        run: |
          # Commit the durable bundle on Mondays or after a cache miss, to keep
          # a recent fallback without a 26 MB git commit every single day.
          dow=$(date -u +%u)
          if [ "$dow" = "1" ] || [ "${{ steps.state.outputs.restored }}" = "false" ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bundle snapshot
        if: steps.snap.outputs.commit == 'true'
        run: |
          if git diff --quiet -- data/seed/bundle.json; then
            echo "Bundle unchanged -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seed/bundle.json
          git commit -m "Daily bundle snapshot ($(date -u +%F))"
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Daily refresh finished" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/.cron_last_run.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/.cron_last_run.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
